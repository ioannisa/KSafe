# Keeps the GitHub Actions that CI uses current. Library and toolchain dependencies are
# upgraded by hand with each release, because they change what KSafe's users get.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      routine-actions:
        update-types:
          - "minor"
          - "patch"
